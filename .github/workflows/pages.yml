# Builds the web app in demo mode and publishes it to GitHub Pages on every push to main.
# Enable it once in the repo: Settings -> Pages -> Source: GitHub Actions. No secrets needed.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Server tests
        working-directory: server
        run: npm ci && npm test
      - name: Web tests and evaluation
        working-directory: web
        run: npm ci && npm test && npm run eval
      - name: Build (demo mode)
        working-directory: web
        env:
          VITE_DEMO: "1"
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
